# Example: Multi-Model Configuration
# Uses different LLM providers for different tasks

llm:
  # Gemini for hypothesis generation (good at reasoning)
  hypothesis_model:
    provider: "gemini"
    model: "gemini-3-pro-preview"
    api_key_env: "GEMINI_API_KEY"
    temperature: 0.7
    max_tokens: 4096

  # Claude for coding (good at code generation)
  coding_model:
    provider: "anthropic"
    model: "claude-opus-4-5-20251101"
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.2
    max_tokens: 4096

  # Claude for summarization
  summary_model:
    provider: "anthropic"
    model: "claude-sonnet-4-5-20251101"
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.3
    max_tokens: 2048

execution:
  type: "jupyter"
  timeout_seconds: 300
  max_retries: 3

pipeline:
  max_iterations: 10
  log_dir: "logs"
  output_dir: "outputs"
  save_intermediate: true
