  #   api_key_env: "GOOGLE_API_KEY"
  #   max_tokens: 8192  # Gemini Flash truncates JSON mid-string at the 4096 fallback when reasoning is long (e.g. 2+ SUPPORTS results requiring full 5-criteria evaluation)
  # summary_model:
  #   provider: "openai"
  #   model: "gpt-5.4-mini"
  #   api_key_env: "OPENAI_API_KEY"
  summary_model:
    provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GOOGLE_API_KEY"
    # service_tier: "flex"       # flex | standard | priority  (default: flex)
    # thinking_level: "MEDIUM"   # MINIMAL | LOW | MEDIUM | HIGH  (default: MEDIUM)

execution:
  type: "jupyter"
  timeout_seconds: 900  # 15 min max per execution — covers FIMO + bigWig; kernel death is detected
  max_retries: 12  # Each retry = 4 REPL iterations; total REPL budget = max_retries * 4 = 48
  # max_static_rejections removed — v2 uses REPL loop, no static pre-gate

pipeline:
  max_iterations: 10  # Maximum hypothesis-verification loops
  max_consecutive_hypothesis_rejections: 6  # If reached and any SUPPORTS exist, synthesize and report; else stop
  log_dir: "logs_3"
  output_dir: "outputs_3"
  save_intermediate: true  # Save state after each iteration
