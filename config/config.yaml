# Experiment Design Generation Pipeline Configuration

llm:
  # Model for generating and refining hypotheses
  hypothesis_model:
    provider: "openai"  # Options: openai, anthropic, gemini
    model: "gpt-5-mini"
    api_key_env: "OPENAI_API_KEY"
    # Note: gpt-5-mini only supports temperature=1 (default), so omit temperature
    # Note: Do NOT set max_tokens for OpenAI models - they use tokens for internal reasoning

  # Model for writing verification code
  coding_model:
    provider: "openai"
    model: "gpt-5-mini"
    api_key_env: "OPENAI_API_KEY"
    # Note: gpt-5-mini only supports temperature=1 (default), so omit temperature
    # Note: Do NOT set max_tokens for OpenAI models - they use tokens for internal reasoning

  # Model for summarizing results
  summary_model:
    provider: "openai"
    model: "gpt-5-mini"
    api_key_env: "OPENAI_API_KEY"
    # Note: gpt-5-mini only supports temperature=1 (default), so omit temperature
    # Note: Do NOT set max_tokens for OpenAI models - they use tokens for internal reasoning

execution:
  type: "jupyter"
  timeout_seconds: 0  # No timeout - bioinformatics analyses can take significant time
  max_retries: 5  # Retry code execution on failure

pipeline:
  max_iterations: 10  # Maximum hypothesis-verification loops
  log_dir: "logs"
  output_dir: "outputs"
  save_intermediate: true  # Save state after each iteration
