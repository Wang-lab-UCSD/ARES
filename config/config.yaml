# Experiment Design Generation Pipeline Configuration

llm:
  # Model for generating and refining hypotheses
  hypothesis_model:
    provider: "openai"  # Options: openai, anthropic, gemini
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.7
    max_tokens: 4096

  # Model for writing verification code
  coding_model:
    provider: "openai"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.2  # Lower temperature for more deterministic code
    max_tokens: 4096

  # Model for summarizing results
  summary_model:
    provider: "openai"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.3
    max_tokens: 2048

execution:
  type: "jupyter"
  timeout_seconds: 300  # 5 minutes max per code execution
  max_retries: 3  # Retry code execution on failure

pipeline:
  max_iterations: 10  # Maximum hypothesis-verification loops
  log_dir: "logs"
  output_dir: "outputs"
  save_intermediate: true  # Save state after each iteration
