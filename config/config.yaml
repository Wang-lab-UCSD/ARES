# ARES — Automated Regulatory Explanation System Configuration

llm:
  # Model for generating and refining hypotheses
  hypothesis_model:
    provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GOOGLE_API_KEY"
    # Gemini-only cost knobs. Defaults if omitted: service_tier="flex", thinking_level="MEDIUM".
    # service_tier: "flex"       # flex | standard | priority  — flex is ~50% cheaper, lower priority
    # thinking_level: "MEDIUM"   # MINIMAL | LOW | MEDIUM | HIGH  — thinking tokens bill at output rate



  coding_model:
    provider: "openai"
    model: "MiniMax-M2.7"
    api_key_env: "MINIMAX_API_KEY"
    base_url: "https://api.minimax.io/v1"
    subscription: true
    max_tokens: 24000  # Cap per-call output. MiniMax default is ~64,000 and a
                       # stuck call at 64K per step blows the 204,800 context
                       # window within 2-3 turns (seen in the Apr 14 ELK3 crash).
                       # 24K covers 100% of legitimate calls observed across
                       # 11,254 historical MiniMax calls (max legit = 23,001).


  # Model for hypothesis review
  review_model:
    provider: "openai"
    model: "gpt-5.4-mini"
    api_key_env: "OPENAI_API_KEY"
    reasoning_effort: "medium"

  # Model for summarizing results
  summary_model:
    provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GOOGLE_API_KEY"
    # service_tier: "flex"       # flex | standard | priority  (default: flex)
    # thinking_level: "MEDIUM"   # MINIMAL | LOW | MEDIUM | HIGH  (default: MEDIUM)

execution:
  type: "jupyter"
  timeout_seconds: 900  # 15 min max per execution — covers FIMO + bigWig; kernel death is detected
  max_retries: 12  # Each retry = 4 REPL iterations; total REPL budget = max_retries * 4 = 48
  # max_static_rejections removed — v2 uses REPL loop, no static pre-gate

pipeline:
  max_iterations: 10  # Maximum hypothesis-verification loops
  max_consecutive_hypothesis_rejections: 6  # If reached and any SUPPORTS exist, synthesize and report; else stop
  log_dir: "logs_3"
  output_dir: "outputs_3"
  save_intermediate: true  # Save state after each iteration
