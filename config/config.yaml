    provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GOOGLE_API_KEY"
    # Gemini-only cost knobs. Defaults if omitted: service_tier="flex", thinking_level="MEDIUM".
    # service_tier: "flex"       # flex | standard | priority  — flex is ~50% cheaper, lower priority
    # thinking_level: "MEDIUM"   # MINIMAL | LOW | MEDIUM | HIGH  — thinking tokens bill at output rate

