# ARES — Automated Regulatory Solver Configuration — REPRODUCIBILITY_2
#
# Same as config/config.yaml EXCEPT the pipeline section writes into
# production-only directories (outputs_reproducibility_2/, logs_reproducibility_2/) so
# production-batch artifacts don't land in the outputs_3/ / logs_3/ tree
# used for test and validation runs.
#
# scripts/submit_batch.py uses this config by default. Keep it in sync with
# config/config.yaml for LLM + execution settings; only pipeline.log_dir
# and pipeline.output_dir should differ.

llm:

  hypothesis_model:
    provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GOOGLE_API_KEY"

  coding_model:
    provider: "openai"
    model: "MiniMax-M2.7"
    api_key_env: "MINIMAX_API_KEY"
    base_url: "https://api.minimax.io/v1"
    subscription: true
    max_tokens: 24000  # Cap per-call output. MiniMax default is ~64,000 and a
                       # stuck call at 64K per step blows the 204,800 context
                       # window within 2-3 turns (Apr 14 ELK3 crash).
                       # 24K covers 100% of legitimate calls observed across
                       # 11,254 historical MiniMax calls (max legit = 23,001).

  review_model:
    provider: "openai"
    model: "gpt-5.4-mini"
    api_key_env: "OPENAI_API_KEY"
    reasoning_effort: "medium"

  summary_model:
    provider: "gemini"
    model: "gemini-3.1-pro-preview"
    api_key_env: "GOOGLE_API_KEY"
    # service_tier: "flex"       # flex | standard | priority  (default: flex)
    # thinking_level: "MEDIUM"   # MINIMAL | LOW | MEDIUM | HIGH  (default: MEDIUM)

execution:
  type: "jupyter"
  timeout_seconds: 900  # 15 min max per execution — covers FIMO + bigWig; kernel death is detected
  max_retries: 12  # Each retry = 4 REPL iterations; total REPL budget = max_retries * 4 = 48
  # max_static_rejections removed — v2 uses REPL loop, no static pre-gate

pipeline:
  max_iterations: 20  # Reproducibility stress test — raised from 10 to give the hypothesis agent more room to land on the right sub-mechanism before hitting the iteration budget.
  max_consecutive_hypothesis_rejections: 6  # If reached and any SUPPORTS exist, synthesize and report; else stop
  log_dir: "logs_reproducibility_2"       # REPRODUCIBILITY_2 — separate from logs_3 test tree
  output_dir: "outputs_reproducibility_2"  # REPRODUCIBILITY_2 — separate from outputs_3 test tree
  save_intermediate: true  # Save state after each iteration
