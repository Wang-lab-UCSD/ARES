[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-designs-pipeline"
version = "0.1.0"
description = "Multi-agent pipeline for automated hypothesis generation and verification in bioinformatics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Kept in step with requirements.txt, which carries the reasoning behind
    # each floor and cap. Install with `pip install -r requirements.txt`; this
    # list exists so `pip install -e .` produces the same environment.
    "anthropic>=0.84.0,<1",
    "google-genai>=1.72.0,<2",
    "openai>=2.24.0,<3",
    "tiktoken>=0.12.0,<1",
    "pydantic>=2.12.5,<3",
    "PyYAML>=6.0.3,<7",
    "rich>=14.3.3,<15",
    "requests>=2.32.5,<3",
    "ipykernel>=7.2.0,<8",
    "jupyter_client>=8.8.0,<9",
    "numpy>=2.4.2,<3",
    "pandas>=3.0.1,<4",
    "scipy>=1.17.1,<2",
    "matplotlib>=3.10.8,<4",
    "statsmodels>=0.14.6,<1",
    "scikit-learn>=1.8.0,<2",
    "pyBigWig>=0.3.25,<1",
    "pybedtools>=0.12.0,<1",
    "pyfaidx>=0.9.0.3,<1",
    "biopython>=1.86,<2",
    "pysam>=0.23.3,<1",
    "gprofiler-official>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
]

[project.scripts]
hypothesis-pipeline = "src.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
