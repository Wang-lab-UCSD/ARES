# ATF3/USF1 Example Data Manifest (GM12878)
# Investigation: Why does USF1 motif predict ATF3 binding signal?

finding: >
  The USF1 motif is the most important feature for predicting ATF3 binding signal.
  This is surprising because USF1 and ATF3 are different transcription factors.
  The goal is to explain the biological mechanism behind this relationship.

context: |
  I aim to comprehend how various transcription factors interact with one another
  to regulate gene expression. I currently only download the ChIP-seq data from
  ENCODE for various transcription factors in diverse cell lines. It is possible
  to download other publicly available data to verify if needed.

  My ML model suggests that for the ATF3 binding signal prediction task, the
  occurrence of the USF1 motif plays the most important role.

