    h3k4me3_signal: "/new-stg/home/hanbei/data/histone/GM12878/H3K4me3/ENCFF287HAO.bigWig"
    h3k4me3_signal_role: "Active promoter mark; enriched at TSS"
    chromhmm: "/new-stg/home/hanbei/data/chromHMM/E116_18_core_K27ac_hg38lift_mnemonics.bed"
    chromhmm_format: "BED, 4 columns: chrom, start, end, state_mnemonic (e.g. 9_EnhA1). State is 4th column; match against chromhmm_promoter/chromhmm_enhancer lists."
    chromhmm_promoter_state: ["1_TssA", "2_TssFlnk", "3_TssFlnkU", "4_TssFlnkD", "14_TssBiv"]
    chromhmm_enhancer_state: ["7_EnhG1", "8_EnhG2", "9_EnhA1", "10_EnhA2", "11_EnhWk", "15_EnhBiv"]
    chromhmm_transcription_state: ["5_Tx", "6_TxWk"]
