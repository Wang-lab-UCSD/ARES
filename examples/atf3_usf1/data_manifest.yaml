# ATF3/USF1 Example Data Manifest (GM12878)
# Investigation: Why does USF1 motif predict ATF3 binding signal?

finding: >
  The USF1 motif is the most important feature for predicting ATF3 binding signal.
  The goal is to explain the biomolecular mechanism behind this relationship.

context: |
  I want to understand the mechanism of how different transcription factors cooperate
  with other transcription factors to regulate gene expression. I currently download the ChIP-seq 
  data from ENCODE for various transcription factors in diverse cell lines, also I 
  download RNA-seq, Hi-C data, ChromHMM, H3K27ac, H3K4me3 ChIP-seq, DNase-seq, phyloP score,
  WGBS. It is possible to download other public available data to verify if needed.

  My ML model currently suggests that for ATF3 binding affinity prediction task, 
  USF1 motif plays the most significant role in GM12878.

# Goal of this run: discovery and synthesis (convergence on a new named mechanism is acceptable)
investigation_objective: >
  Characterize the mechanism linking TF_B (motif) to TF_A binding; synthesize a coherent
  causal narrative, possibly identifying a new mechanism not in the predefined taxonomy.

data:
  # ChIP-seq peak files (GM12878 cell line)
  # IMPORTANT: Use absolute paths for Jupyter kernel compatibility
  chipseq:
    ATF3_peaks: "/new-stg/home/hanbei/data/TF_ENCODE4/GM12878/ATF3_human/ENCFF882AEU.bed"
    ATF3_peaks_format: "narrowPeak (hg38)"
    ATF3_bigwig_fold_change_over_control: "/new-stg/home/hanbei/data/TF_ENCODE4/GM12878/ATF3_human/ENCFF243XPP.bigWig"

    USF1_peaks: "/new-stg/home/hanbei/data/TF_ENCODE4/GM12878/USF1_human/ENCFF879TPT.bed"
    USF1_peaks_format: "narrowPeak (hg38)"
    USF1_bigwig_fold_change_over_control: "/new-stg/home/hanbei/data/TF_ENCODE4/GM12878/USF1_human/ENCFF029MAS.bigWig"

  # Position Weight Matrices (JASPAR 2022)
  pwm:
    jaspar_meme: "/new-stg/home/hanbei/HanX/data/JASPAR/JASPAR2022_CORE_vertebrates_non-redundant_v2.meme"
    ATF3_motif_id: "MA1988.1"
    USF1_motif_id: "MA0093.3"

  # Reference genome
  genome:
    fasta: "/new-stg/home/hanbei/data/hg38.fa"

  # Gene expression data (GM12878)
  rnaseq:
    gene_quantification: "/new-stg/home/hanbei/data/RNAseq_ENCODE/GM12878.tsv"
    gene_quantification_id_type: "Ensembl gene IDs (ENSG...); TPM column available"

  # Gene annotations
  annotations:
    gencode: "/new-stg/home/hanbei/data/gencode.v38.annotation.gtf"

  # Epigenomic data (GM12878)
  epigenome:
    dnase_signal: "/new-stg/home/hanbei/data/DNaseseq_ENCODE/GM12878.bigWig"
    dnase_signal_role: "Chromatin accessibility; higher = more open"
    h3k27ac_signal: "/new-stg/home/hanbei/data/histone/GM12878/H3K27ac/ENCFF469WVA.bigWig"
