# MAX/ZBTB14 Example Data Manifest (GM12878)
# Investigation: Why does ZBTB14 motif predict MAX binding signal?

finding: >
  The ZBTB14 motif is the most important feature for predicting MAX binding signal.
  This is surprising because ZBTB14 and MAX are different transcription factors.
  The goal is to explain the biological mechanism behind this relationship.

context: |
  I aim to comprehend how various transcription factors interact with one another
  to regulate gene expression. I currently only download the ChIP-seq data from
  ENCODE for various transcription factors in diverse cell lines. It is possible
  to download other publicly available data to verify if needed.

  My ML model suggests that for the MAX binding signal prediction task, the
  occurrence of the ZBTB14 motif plays the most important role.

