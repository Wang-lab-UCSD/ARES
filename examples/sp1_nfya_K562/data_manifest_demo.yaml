    dnase_signal_role: Chromatin accessibility; higher = more open
    h3k27ac_bigwig_fold_change_over_control: data/ENCFF381NDD.bigWig
    h3k27ac_signal_role: Active enhancer/promoter mark
    h3k4me3_bigwig_fold_change_over_control: data/ENCFF253TOF.bigWig
    h3k4me3_signal_role: Active promoter mark; enriched at TSS
    h3k27me3_bigwig_fold_change_over_control: data/ENCFF139KZL.bigWig
    h3k27me3_signal_role: Polycomb repression mark; enriched at silenced genes and bivalent promoters
    h3k4me1_bigwig_fold_change_over_control: data/ENCFF607SUJ.bigWig
    h3k4me1_signal_role: Enhancer mark (primed and active enhancers); distinguishes enhancers from promoters
      (which have H3K4me3). H3K4me1-high + H3K27ac-high = active enhancer; H3K4me1-high + H3K27ac-low
      = primed/poised enhancer.
    h3k9me3_bigwig_fold_change_over_control: data/ENCFF812HRW.bigWig
    h3k9me3_signal_role: Constitutive heterochromatin mark; enriched at pericentromeric regions, KRAB-ZNF-silenced
      regions, and transposable elements. Distinguishes KRAB/TRIM28-mediated repression from Polycomb
      (H3K27me3) repression.
    chromhmm: data/E123_18_core_K27ac_hg38lift_mnemonics.bed
    chromhmm_format: 'BED, 4 columns: chrom, start, end, state_mnemonic (e.g. 9_EnhA1)'
    chromhmm_promoter_state:
