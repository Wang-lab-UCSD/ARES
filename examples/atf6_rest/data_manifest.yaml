# ATF6/REST Example Data Manifest
# This example is based on Hanbei's investigation of why REST motif
# predicts ATF6 binding affinity

finding: >
  The REST motif is the most important feature for predicting ATF6 binding signal.
  This is surprising because REST (NRSF) and ATF6 are different transcription factors
  with different biological functions. The goal is to explain the biological mechanism
  behind this relationship — confirming that they co-occur is a necessary first step
  but not the end goal.

context: |
  I aim to comprehend how various transcription factors interact with one another
  to regulate gene expression. I currently only download the ChIP-seq data from
  ENCODE for various transcription factors in diverse cell lines. It is possible
  to download other publicly available data to verify if needed.

  My ML model suggests that for the ATF6 binding signal prediction task, the
  occurrence of the REST motif plays the most important role.

  ATF6 binds the sequence CCACG (often within an ERSE context), and the REST
  binding site (RE1) is a large (~21bp) consensus sequence (e.g., TTCAGCACCACGGACAGCGCC).

  Key observation: The RE1 consensus often contains the CCACG or TGACG sequence within it.

